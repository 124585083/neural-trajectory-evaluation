  <text x="110" y="100" text-anchor="start" font-size="48" font-weight="700" fill="#152238" class=""><tspan x="110" dy="0">Where does the Dynamic model outperform the Static model?</tspan></text><text x="110" y="154" text-anchor="start" font-size="25" font-weight="400" fill="#5E6B7A" class=""><tspan x="110" dy="0">Paired condition comparison for the parameter-matched models; points show Dynamic - Static and bars show 95% bootstrap intervals.</tspan></text><rect x="100" y="280" width="1970" height="110" rx="18" fill="#4C78A8" opacity="0.055"/><text x="135" y="318" font-size="20" font-weight="700" fill="#4C78A8">RESPONSE</text><rect x="100" y="425" width="1970" height="220" rx="18" fill="#8F63B8" opacity="0.055"/><text x="135" y="463" font-size="20" font-weight="700" fill="#8F63B8">OUTPUT-SPACE GEOMETRY</text><rect x="100" y="690" width="1970" height="430" rx="18" fill="#177E89" opacity="0.055"/><text x="135" y="728" font-size="20" font-weight="700" fill="#177E89">TRAJECTORY</text><line x1="800" y1="270" x2="800" y2="1095" stroke="#D7DEE7" stroke-width="1.5"/><text x="800" y="1147" text-anchor="middle" font-size="22" fill="#5E6B7A">-0.1</text><line x1="1011.6666666666667" y1="270" x2="1011.6666666666667" y2="1095" stroke="#152238" stroke-width="3"/><text x="1011.6666666666667" y="1147" text-anchor="middle" font-size="22" fill="#5E6B7A">0.0</text><line x1="1223.3333333333335" y1="270" x2="1223.3333333333335" y2="1095" stroke="#D7DEE7" stroke-width="1.5"/><text x="1223.3333333333335" y="1147" text-anchor="middle" font-size="22" fill="#5E6B7A">+0.1</text><line x1="1435" y1="270" x2="1435" y2="1095" stroke="#D7DEE7" stroke-width="1.5"/><text x="1435" y="1147" text-anchor="middle" font-size="22" fill="#5E6B7A">+0.2</text><line x1="1646.6666666666667" y1="270" x2="1646.6666666666667" y2="1095" stroke="#D7DEE7" stroke-width="1.5"/><text x="1646.6666666666667" y="1147" text-anchor="middle" font-size="22" fill="#5E6B7A">+0.3</text><line x1="1858.3333333333335" y1="270" x2="1858.3333333333335" y2="1095" stroke="#D7DEE7" stroke-width="1.5"/><text x="1858.3333333333335" y="1147" text-anchor="middle" font-size="22" fill="#5E6B7A">+0.4</text><line x1="2070" y1="270" x2="2070" y2="1095" stroke="#D7DEE7" stroke-width="1.5"/><text x="2070" y="1147" text-anchor="middle" font-size="22" fill="#5E6B7A">+0.5</text><text x="170" y="344" font-size="26" font-weight="700" fill="#152238">Response correlation</text><line x1="1061.0908333333334" y1="335" x2="1148.9113333333332" y2="335" stroke="#4C78A8" stroke-width="7" stroke-linecap="round"/><line x1="1061.0908333333334" y1="320" x2="1061.0908333333334" y2="350" stroke="#4C78A8" stroke-width="4"/><line x1="1148.9113333333332" y1="320" x2="1148.9113333333332" y2="350" stroke="#4C78A8" stroke-width="4"/><circle cx="1106.2605" cy="335" r="13" fill="#FFFFFF" stroke="#4C78A8" stroke-width="7"/><text x="1172.9113333333332" y="343" font-size="22" font-weight="700" fill="#4C78A8">+0.045</text><text x="170" y="494" font-size="26" font-weight="700" fill="#152238">Temporal CKA</text><line x1="1075.9921666666667" y1="485" x2="1362.0808333333334" y2="485" stroke="#F28E2B" stroke-width="7" stroke-linecap="round"/><line x1="1075.9921666666667" y1="470" x2="1075.9921666666667" y2="500" stroke="#F28E2B" stroke-width="4"/><line x1="1362.0808333333334" y1="470" x2="1362.0808333333334" y2="500" stroke="#F28E2B" stroke-width="4"/><circle cx="1192.4935" cy="485" r="13" fill="#FFFFFF" stroke="#F28E2B" stroke-width="7"/><text x="1386.0808333333334" y="493" font-size="22" font-weight="700" fill="#F28E2B">+0.085</text><text x="170" y="594" font-size="26" font-weight="700" fill="#152238">Temporal RSA</text><line x1="1076.8811666666666" y1="585" x2="1420.141" y2="585" stroke="#8F63B8" stroke-width="7" stroke-linecap="round"/><line x1="1076.8811666666666" y1="570" x2="1076.8811666666666" y2="600" stroke="#8F63B8" stroke-width="4"/><line x1="1420.141" y1="570" x2="1420.141" y2="600" stroke="#8F63B8" stroke-width="4"/><circle cx="1200.5368333333333" cy="585" r="13" fill="#FFFFFF" stroke="#8F63B8" stroke-width="7"/><text x="1444.141" y="593" font-size="22" font-weight="700" fill="#8F63B8">+0.089</text><text x="170" y="769" font-size="26" font-weight="500" fill="#152238">GPFA position</text><line x1="1198.6318333333334" y1="760" x2="1966.8336666666667" y2="760" stroke="#177E89" stroke-width="7" stroke-linecap="round"/><line x1="1198.6318333333334" y1="745" x2="1198.6318333333334" y2="775" stroke="#177E89" stroke-width="4"/><line x1="1966.8336666666667" y1="745" x2="1966.8336666666667" y2="775" stroke="#177E89" stroke-width="4"/><circle cx="1485.3766666666666" cy="760" r="13" fill="#FFFFFF" stroke="#177E89" stroke-width="7"/><text x="1990.8336666666667" y="768" font-size="22" font-weight="700" fill="#177E89">+0.224</text><text x="170" y="869" font-size="26" font-weight="500" fill="#152238">GPFA velocity direction</text><line x1="1294.3898333333334" y1="860" x2="1537.8911666666668" y2="860" stroke="#177E89" stroke-width="7" stroke-linecap="round"/><line x1="1294.3898333333334" y1="845" x2="1294.3898333333334" y2="875" stroke="#177E89" stroke-width="4"/><line x1="1537.8911666666668" y1="845" x2="1537.8911666666668" y2="875" stroke="#177E89" stroke-width="4"/><circle cx="1423.8451666666667" cy="860" r="13" fill="#FFFFFF" stroke="#177E89" stroke-width="7"/><text x="1561.8911666666668" y="868" font-size="22" font-weight="700" fill="#177E89">+0.195</text><text x="170" y="969" font-size="26" font-weight="500" fill="#152238">GPFA speed profile</text><line x1="903.1663333333333" y1="960" x2="1193.4036666666668" y2="960" stroke="#177E89" stroke-width="7" stroke-linecap="round"/><line x1="903.1663333333333" y1="945" x2="903.1663333333333" y2="975" stroke="#177E89" stroke-width="4"/><line x1="1193.4036666666668" y1="945" x2="1193.4036666666668" y2="975" stroke="#177E89" stroke-width="4"/><circle cx="1034.6113333333333" cy="960" r="13" fill="#FFFFFF" stroke="#177E89" stroke-width="7"/><text x="1217.4036666666668" y="968" font-size="22" font-weight="700" fill="#177E89">+0.011</text><text x="170" y="1069" font-size="26" font-weight="500" fill="#152238">GPFA acceleration direction</text><line x1="1397.2598333333335" y1="1060" x2="1730.3384999999998" y2="1060" stroke="#177E89" stroke-width="7" stroke-linecap="round"/><line x1="1397.2598333333335" y1="1045" x2="1397.2598333333335" y2="1075" stroke="#177E89" stroke-width="4"/><line x1="1730.3384999999998" y1="1045" x2="1730.3384999999998" y2="1075" stroke="#177E89" stroke-width="4"/><circle cx="1578.7851666666666" cy="1060" r="13" fill="#FFFFFF" stroke="#177E89" stroke-width="7"/><text x="1754.3384999999998" y="1068" font-size="22" font-weight="700" fill="#177E89">+0.268</text><text x="1435" y="1200" text-anchor="middle" font-size="27" font-weight="700" fill="#152238">Dynamic - Static agreement with neural data</text><text x="993.6666666666667" y="230" text-anchor="end" font-size="21" fill="#5E6B7A">Static better</text><text x="1029.6666666666667" y="230" font-size="21" fill="#5E6B7A">Dynamic better</text><text x="110" y="1285" text-anchor="start" font-size="25" font-weight="400" fill="#5E6B7A" class=""><tspan x="110" dy="0">Response and time-aware RSA/CKA detect gains. Direction-sensitive trajectory metrics show additional separation; speed-profile evidence remains weak.</tspan></text>
</svg>