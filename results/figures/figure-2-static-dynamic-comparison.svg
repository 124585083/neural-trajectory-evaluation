<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1350" viewBox="0 0 2200 1350" role="img" aria-labelledby="title desc">
  <title id="title">Static-Dynamic comparison across response, RSA, CKA, and trajectory metrics</title>
  <desc id="desc">Static-Dynamic comparison across response, RSA, CKA, and trajectory metrics</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#152238" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E6B7A"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#177E89" stroke-width="3" opacity="0.45"/></pattern>
