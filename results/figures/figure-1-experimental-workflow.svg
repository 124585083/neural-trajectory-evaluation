<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1450" viewBox="0 0 2400 1450" role="img" aria-labelledby="title desc">
  <title id="title">Experimental design for Static-Dynamic neural trajectory evaluation</title>
  <desc id="desc">Experimental design for Static-Dynamic neural trajectory evaluation</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#152238" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E6B7A"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#177E89" stroke-width="3" opacity="0.45"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .axis { font-size: 24px; fill: #5E6B7A; }
    .value { font-size: 24px; font-weight: 700; fill: #152238; }
  </style>
  <text x="120" y="105" text-anchor="start" font-size="48" font-weight="700" fill="#152238" class=""><tspan x="120" dy="0">Experimental design: comparing Static and Dynamic beyond response accuracy</tspan></text><text x="120" y="157" text-anchor="start" font-size="25" font-weight="400" fill="#5E6B7A" class=""><tspan x="120" dy="0">Models share data and evaluation contracts and have close total counts, while their core architectures and temporal access remain different.</tspan></text><g filter="url(#shadow)"><rect x="110" y="260" width="420" height="270" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2"/><rect x="110" y="260" width="10" height="270" rx="5" fill="#4C78A8"/></g><rect x="140" y="285" width="90" height="38" rx="19" fill="#4C78A8" opacity="0.12"/><text x="155" y="312" font-size="21" font-weight="700" fill="#4C78A8">DATA</text><text x="142" y="365" text-anchor="start" font-size="31" font-weight="700" fill="#152238" class=""><tspan x="142" dy="0">Dynamic Sensorium 2023</tspan></text><text x="142" y="410" text-anchor="start" font-size="23" font-weight="400" fill="#5E6B7A" class=""><tspan x="142" dy="0">Natural movies</tspan><tspan x="142" dy="29.900000000000002">Mouse V1 population responses</tspan><tspan x="142" dy="29.900000000000002">Synchronized behavior</tspan></text><g filter="url(#shadow)"><rect x="680" y="225" width="455" height="245" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2"/><rect x="680" y="225" width="10" height="245" rx="5" fill="#7B8794"/></g><rect x="710" y="250" width="105" height="38" rx="19" fill="#7B8794" opacity="0.12"/><text x="725" y="277" font-size="21" font-weight="700" fill="#7B8794">MODEL A</text><text x="712" y="330" text-anchor="start" font-size="31" font-weight="700" fill="#152238" class=""><tspan x="712" dy="0">Static model</tspan></text><text x="712" y="375" text-anchor="start" font-size="23" font-weight="400" fill="#5E6B7A" class=""><tspan x="712" dy="0">Frame-wise 2D core</tspan><tspan x="712" dy="29.900000000000002">2,814,015 parameters</tspan><tspan x="712" dy="29.900000000000002">No learned temporal context</tspan></text><g filter="url(#shadow)"><rect x="680" y="555" width="455" height="245" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2"/><rect x="680" y="555" width="10" height="245" rx="5" fill="#177E89"/></g><rect x="710" y="580" width="105" height="38" rx="19" fill="#177E89" opacity="0.12"/><text x="725" y="607" font-size="21" font-weight="700" fill="#177E89">MODEL B</text><text x="712" y="660" text-anchor="start" font-size="31" font-weight="700" fill="#152238" class=""><tspan x="712" dy="0">Reduced Dynamic model</tspan></text><text x="712" y="705" text-anchor="start" font-size="23" font-weight="400" fill="#5E6B7A" class=""><tspan x="712" dy="0">Factorized 3D core</tspan><tspan x="712" dy="29.900000000000002">2,862,063 parameters</tspan><tspan x="712" dy="29.900000000000002">Learned temporal context</tspan></text><path d="M 530 375 L 680 347" stroke="#5E6B7A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 530 430 L 680 675" stroke="#5E6B7A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 1135 347 C 1260 347, 1240 475, 1350 475" stroke="#5E6B7A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 1135 675 C 1260 675, 1240 525, 1350 525" stroke="#5E6B7A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1350" y="365" width="430" height="270" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2"/><rect x="1350" y="365" width="10" height="270" rx="5" fill="#F28E2B"/></g><rect x="1380" y="390" width="90" height="38" rx="19" fill="#F28E2B" opacity="0.12"/><text x="1395" y="417" font-size="21" font-weight="700" fill="#F28E2B">OUTPUT</text><text x="1382" y="470" text-anchor="start" font-size="31" font-weight="700" fill="#152238" class=""><tspan x="1382" dy="0">Frozen neural predictions</tspan></text><text x="1382" y="515" text-anchor="start" font-size="23" font-weight="400" fill="#5E6B7A" class=""><tspan x="1382" dy="0">Same oracle movies</tspan><tspan x="1382" dy="29.900000000000002">Matched neurons and timestamps</tspan><tspan x="1382" dy="29.900000000000002">No evaluation-driven fitting</tspan></text><g filter="url(#shadow)"><rect x="1885" y="210" width="390" height="185" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2"/><rect x="1885" y="210" width="10" height="185" rx="5" fill="#4C78A8"/></g><rect x="1915" y="235" width="105" height="38" rx="19" fill="#4C78A8" opacity="0.12"/><text x="1930" y="262" font-size="21" font-weight="700" fill="#4C78A8">LEVEL 1</text><text x="1917" y="315" text-anchor="start" font-size="31" font-weight="700" fill="#152238" class=""><tspan x="1917" dy="0">Response</tspan></text><text x="1917" y="360" text-anchor="start" font-size="23" font-weight="400" fill="#5E6B7A" class=""><tspan x="1917" dy="0">Per-neuron correlation</tspan><tspan x="1917" dy="29.900000000000002">Predictive accuracy</tspan></text><g filter="url(#shadow)"><rect x="1885" y="455" width="390" height="185" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2"/><rect x="1885" y="455" width="10" height="185" rx="5" fill="#8F63B8"/></g><rect x="1915" y="480" width="105" height="38" rx="19" fill="#8F63B8" opacity="0.12"/><text x="1930" y="507" font-size="21" font-weight="700" fill="#8F63B8">LEVEL 2</text><text x="1917" y="560" text-anchor="start" font-size="31" font-weight="700" fill="#152238" class=""><tspan x="1917" dy="0">RSA / CKA</tspan></text><text x="1917" y="605" text-anchor="start" font-size="23" font-weight="400" fill="#5E6B7A" class=""><tspan x="1917" dy="0">Output-space geometry</tspan><tspan x="1917" dy="29.900000000000002">Predicted neural responses</tspan></text><g filter="url(#shadow)"><rect x="1885" y="700" width="390" height="205" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2"/><rect x="1885" y="700" width="10" height="205" rx="5" fill="#177E89"/></g><rect x="1915" y="725" width="105" height="38" rx="19" fill="#177E89" opacity="0.12"/><text x="1930" y="752" font-size="21" font-weight="700" fill="#177E89">LEVEL 3</text><text x="1917" y="805" text-anchor="start" font-size="31" font-weight="700" fill="#152238" class=""><tspan x="1917" dy="0">Neural trajectory</tspan></text><text x="1917" y="850" text-anchor="start" font-size="23" font-weight="400" fill="#5E6B7A" class=""><tspan x="1917" dy="0">Position and RMSE</tspan><tspan x="1917" dy="29.900000000000002">Velocity, speed, acceleration</tspan></text><path d="M 1780 470 L 1885 303" stroke="#5E6B7A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 1780 500 L 1885 548" stroke="#5E6B7A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 1780 530 L 1885 800" stroke="#5E6B7A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="885" y="995" width="520" height="255" rx="22" fill="#FFFFFF" stroke="#D7DEE7" stroke-width="2"/><rect x="885" y="995" width="10" height="255" rx="5" fill="#2E8B57"/></g><rect x="915" y="1020" width="180" height="38" rx="19" fill="#2E8B57" opacity="0.12"/><text x="930" y="1047" font-size="21" font-weight="700" fill="#2E8B57">LATENT SPACE</text><text x="917" y="1100" text-anchor="start" font-size="31" font-weight="700" fill="#152238" class=""><tspan x="917" dy="0">Neural-data-defined GPFA</tspan></text><text x="917" y="1145" text-anchor="start" font-size="23" font-weight="400" fill="#5E6B7A" class=""><tspan x="917" dy="0">Fit only on neural training data</tspan><tspan x="917" dy="29.900000000000002">Frozen before model evaluation</tspan><tspan x="917" dy="29.900000000000002">No model-specific latent alignment</tspan></text><path d="M 530 505 L 885 1080" stroke="#5E6B7A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 1405 1120 L 1885 850" stroke="#5E6B7A" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="120" y="1300" width="2150" height="92" rx="18" fill="#F4F7FA"/><text x="150" y="1338" text-anchor="start" font-size="23" font-weight="700" fill="#152238" class=""><tspan x="150" dy="0">Key controls</tspan></text><circle cx="420" cy="1345" r="9" fill="#177E89"/><text x="440" y="1353" text-anchor="start" font-size="22" font-weight="400" fill="#152238" class=""><tspan x="440" dy="0">Total-parameter matching</tspan></text><circle cx="860" cy="1345" r="9" fill="#2E8B57"/><text x="880" y="1353" text-anchor="start" font-size="22" font-weight="400" fill="#152238" class=""><tspan x="880" dy="0">Reliability + null tests</tspan></text><circle cx="1300" cy="1345" r="9" fill="#4C78A8"/><text x="1320" y="1353" text-anchor="start" font-size="18" font-weight="400" fill="#152238" class=""><tspan x="1320" dy="0">Response-score-matched output perturbation</tspan></text><circle cx="1740" cy="1345" r="9" fill="#C84C4C"/><text x="1760" y="1353" text-anchor="start" font-size="22" font-weight="400" fill="#152238" class=""><tspan x="1760" dy="0">Temporal-history ablation</tspan></text>
</svg>