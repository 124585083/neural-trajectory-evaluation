   <g id="text_1">
    <text style="fill: #20364d; font: 700 21px 'DejaVu Sans'; text-anchor: start" x="50.4" y="41.876719" transform="rotate(-0 50.4 41.876719)">Proposed next study: behavior within the same physical condition</text>
   </g>
   <g id="text_2">
    <text style="fill: #526476; font: 12px 'DejaVu Sans'; text-anchor: start" x="50.4" y="63.170625" transform="rotate(-0 50.4 63.170625)">Proposed protocol  |  Paired neural–behavior trials required  |  Schematic expected patterns</text>
   </g>
   <g id="text_3">
    <text style="fill: #20364d; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="63.504" y="129.792734" transform="rotate(-0 63.504 129.792734)">1  |  Verify paired observations</text>
   </g>
   <g id="text_4">
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 153.798281)">Same animal, session and trial ID</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 167.787531)">Known stimulus + neural + action records</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 181.776781)">Exact event / feedback timing</text>
   </g>
   <g id="text_5">
    <text style="fill: #c35d21; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="383.04" y="129.792734" transform="rotate(-0 383.04 129.792734)">2  |  Group within condition</text>
   </g>
   <g id="text_6">
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(383.04 153.798281)">Signed error: e = endpoint − objective</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(383.04 167.787531)">Positive: e &gt; δ; negative: e &lt; −δ</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(383.04 181.776781)">Choose δ before inspecting neural results</text>
   </g>
   <g id="text_7">
    <text style="fill: #227969; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="702.576" y="129.792734" transform="rotate(-0 702.576 129.792734)">3  |  Establish a reliable contrast</text>
   </g>
   <g id="text_8">
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(702.576 153.798281)">Disjoint paired-trial train / test sets</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(702.576 167.787531)">Frozen representation + readout</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(702.576 181.776781)">Reliability and within-condition shuffles</text>
   </g>
   <g id="text_9">
    <text style="fill: #20364d; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="50.4" y="252.72" transform="rotate(-0 50.4 252.72)">Primary test: pre-feedback signed-error decoding on held-out paired trials</text>
   </g>
   <g id="text_10">
    <text style="fill: #526476; font: 11.5px 'DejaVu Sans'" transform="translate(50.4 288.818203)">Compare with condition/time-only and movement-informed references. Report group coverage and reliability results.</text>
    <text style="fill: #526476; font: 11.5px 'DejaVu Sans'" transform="translate(50.4 304.754059)">Behavioral groups denote action outcomes; a positive neural result could reflect estimate, goal or motor preparation.</text>
   </g>
   <g id="text_11">
    <text style="fill: #227969; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="50.4" y="336.24" transform="rotate(-0 50.4 336.24)">After establishing reliable behavioral correspondence, examine its time course</text>
   </g>
   <g id="text_12">
    <text style="fill: #526476; font: 11.5px 'DejaVu Sans'" transform="translate(50.4 609.218203)">These patterns may coexist. Evaluate event-linked change relative to a pre-event baseline, with reliable support</text>
    <text style="fill: #526476; font: 11.5px 'DejaVu Sans'" transform="translate(50.4 624.717148)">and timing/movement controls. A discriminating follow-up would test the computation producing the difference.</text>
   </g>
   <g id="text_13">
    <text style="fill: #77502b; font: 11.5px 'DejaVu Sans'" transform="translate(65.52 654.660719)">Decision gate: proceed with verified trial pairing, pre-feedback timing and adequate group reliability.</text>
    <text style="fill: #77502b; font: 11.5px 'DejaVu Sans'" transform="translate(65.52 669.285844)">Group-specific neural responses require paired trial records beyond the released condition means.</text>
   </g>
  </g>
