   <g id="text_1">
    <text style="fill: #20364d; font: 700 21px 'DejaVu Sans'; text-anchor: start" x="50.4" y="40.580719" transform="rotate(-0 50.4 40.580719)">Condition-held-out position reconstruction</text>
   </g>
   <g id="text_2">
    <text style="fill: #526476; font: 12px 'DejaVu Sans'; text-anchor: start" x="50.4" y="60.470625" transform="rotate(-0 50.4 60.470625)">Completed protocol  |  Mahler and Perle analyzed separately  |  half1 readouts</text>
   </g>
   <g id="text_3">
    <text style="fill: #77502b; font: 11.5px 'DejaVu Sans'" transform="translate(65.52 94.196797)">Source preprocessing: missing responses were filled across conditions and times.</text>
    <text style="fill: #77502b; font: 11.5px 'DejaVu Sans'" transform="translate(65.52 108.821922)">Training-side fitting and prefix inference use these processed inputs: raw_preprocessing = fail.</text>
   </g>
   <g id="text_4">
    <text style="fill: #20364d; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="63.504" y="178.446047" transform="rotate(-0 63.504 178.446047)">Released neural means</text>
   </g>
   <g id="text_5">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(63.504 201.626203)">79 conditions × 100 bins</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(63.504 216.251328)">50 ms/bin; N aligned units</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(63.504 230.876453)">Individual trial pairing unavailable</text>
   </g>
   <g id="text_6">
    <text style="fill: #20364d; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="381.024" y="178.446047" transform="rotate(-0 381.024 178.446047)">100 fixed condition splits</text>
   </g>
   <g id="text_7">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(381.024 201.626203)">39 train / 40 test identities</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(381.024 216.251328)">Whole conditions held out</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(381.024 230.876453)">Same splits for all comparisons</text>
   </g>
   <g id="text_8">
    <text style="fill: #227969; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="708.624" y="178.446047" transform="rotate(-0 708.624 178.446047)">Fit on training half1 only</text>
   </g>
   <g id="text_9">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(708.624 201.626203)">Neuron eligibility + mean / SD</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(708.624 216.251328)">FA50 or shared-timescale GPFA50</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(708.624 230.876453)">Neural responses define the latent space</text>
   </g>
   <g id="text_10">
    <text style="fill: #227969; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="381.024" y="332.346047" transform="rotate(-0 381.024 332.346047)">Infer held-out features</text>
   </g>
   <g id="text_11">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(381.024 355.526203)">Freeze preprocessing + model</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(381.024 370.151328)">FA50 or prefix GPFA50</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(381.024 384.776453)">50 features per condition/bin</text>
   </g>
   <g id="text_12">
    <text style="fill: #227969; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="708.624" y="332.346047" transform="rotate(-0 708.624 332.346047)">Fit two OLS XY heads</text>
   </g>
   <g id="text_13">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(708.624 355.526203)">Same training features + rows</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(708.624 370.151328)">Objective head / candidate head</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(708.624 384.776453)">One fixed head across phases</text>
   </g>
   <g id="text_14">
    <text style="fill: #20364d; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="506.016" y="278.549344" transform="rotate(-0 506.016 278.549344)">test responses</text>
   </g>
   <g id="text_15">
    <text style="fill: #20364d; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="833.616" y="278.549344" transform="rotate(-0 833.616 278.549344)">train features</text>
   </g>
   <g id="text_16">
    <g id="patch_20">
     <path d="M 631.830117 283.250672 
L 668.489883 283.250672 
L 668.489883 269.098641 
L 631.830117 269.098641 
z
" style="fill: #ffffff"/>
    </g>
    <text style="fill: #227969; font: 10.5px 'DejaVu Sans'; text-anchor: middle" x="650.16" y="279.072" transform="rotate(-0 650.16 279.072)">freeze</text>
   </g>
   <g id="text_17">
    <text style="fill: #24659b; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="381.024" y="493.086047" transform="rotate(-0 381.024 493.086047)">Score test rows only</text>
   </g>
   <g id="text_18">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(381.024 516.266203)">Both heads × both targets</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(381.024 530.891328)">r and RMSE within each phase</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(381.024 545.516453)">Then summarize split scores</text>
   </g>
   <g id="text_19">
    <text style="fill: #c35d21; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="708.624" y="493.086047" transform="rotate(-0 708.624 493.086047)">Separate target branch</text>
   </g>
   <g id="text_20">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(708.624 516.266203)">Physical geometry → objective</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(708.624 530.891328)">Mean paddle endpoint + geometry</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(708.624 545.516453)">→ behavior-constrained candidate</text>
   </g>
   <g id="text_21">
    <text style="fill: #20364d; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="506.016" y="437.237344" transform="rotate(-0 506.016 437.237344)">test features</text>
   </g>
   <g id="text_22">
    <g id="patch_21">
     <path d="M 624.320156 436.466672 
L 696.159844 436.466672 
L 696.159844 422.314641 
L 624.320156 422.314641 
z
" style="fill: #ffffff"/>
    </g>
    <text style="fill: #24659b; font: 10.5px 'DejaVu Sans'; text-anchor: middle" x="660.24" y="432.288" transform="rotate(-0 660.24 432.288)">frozen heads</text>
   </g>
   <g id="text_23">
    <text style="fill: #c35d21; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="833.616" y="437.237344" transform="rotate(-0 833.616 437.237344)">train labels</text>
   </g>
   <g id="text_24">
    <text style="fill: #c35d21; font: 10px 'DejaVu Sans'; text-anchor: middle" x="657.216" y="507.528" transform="rotate(-0 657.216 507.528)">test labels</text>
   </g>
   <g id="text_25">
    <text style="fill: #20364d; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="63.504" y="332.346047" transform="rotate(-0 63.504 332.346047)">Fixed within a split</text>
   </g>
   <g id="text_26">
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 355.146281)">• Animal analyzed separately</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 369.135531)"/>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 383.124781)">• Split identities and masks</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 397.114031)"/>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 411.103281)">• Unlabeled neural representation</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 425.092531)"/>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 439.081781)">• OLS head within every phase</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 453.071031)"/>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 467.060281)">Only the downstream target</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(63.504 481.049531)">and control operation change.</text>
   </g>
   <g id="text_27">
    <text style="fill: #526476; font: 11.5px 'DejaVu Sans'" transform="translate(50.4 627.758203)">78 geometry-valid conditions; 59920 remains in the 79-ID split file with labels unscored.</text>
    <text style="fill: #526476; font: 11.5px 'DejaVu Sans'" transform="translate(50.4 643.257148)">100 overlapping splits provide 100 resamplings of the same neural datasets.</text>
   </g>
  </g>
 </g>
