   <g id="text_7">
    <text style="fill: #526476; font: 11.5px 'DejaVu Sans'; text-anchor: start" x="60.48" y="407.093281" transform="rotate(-0 60.48 407.093281)">b is a retrospective condition-mean terminal paddle label; its exact pre-feedback timing is unresolved.</text>
   </g>
   <g id="text_8">
    <text style="fill: #20364d; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="60.48" y="442.728" transform="rotate(-0 60.48 442.728)">A  |  Same test predictions, both references</text>
   </g>
