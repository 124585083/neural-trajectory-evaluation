      <tspan style="font: oblique 9.1px 'DejaVu Sans'" x="171.577148 177.144678 182.921045 224.696875 285.345557 316.687109 321.690332 327.266748 333.034229 421.000049" y="2.0078125">objaacanda</tspan>
