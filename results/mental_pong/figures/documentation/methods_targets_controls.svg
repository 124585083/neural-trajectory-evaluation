   </g>
   <g id="text_14">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'; text-anchor: middle" x="486.36" y="519.557281" transform="rotate(-0 486.36 519.557281)">OB</text>
   </g>
   <g id="text_15">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'; text-anchor: middle" x="171.36" y="552.821281" transform="rotate(-0 171.36 552.821281)">Candidate head</text>
   </g>
   <g id="text_16">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'; text-anchor: middle" x="350.28" y="552.821281" transform="rotate(-0 350.28 552.821281)">BO</text>
   </g>
   <g id="text_17">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'; text-anchor: middle" x="486.36" y="552.821281" transform="rotate(-0 486.36 552.821281)">BB</text>
   </g>
   <g id="text_18">
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(579.6 492.650203)">OO vs BB: change both head and target</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(579.6 509.459879)">OO vs BO: keep objective reference fixed</text>
    <text style="fill: #20364d; font: 11.5px 'DejaVu Sans'" transform="translate(579.6 526.269555)">OB vs BB: keep candidate reference fixed</text>
   </g>
   <g id="text_19">
    <text style="fill: #24659b; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="73.584" y="634.440734" transform="rotate(-0 73.584 634.440734)">B  |  Shuffle test-condition references</text>
   </g>
   <g id="text_20">
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(73.584 660.966281)">Fitted head + predictions stay FIXED.</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(73.584 674.955531)">Re-score matched / shuffled labels on the same intersection.</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(73.584 688.944781)">Also disrupts physical condition correspondence.</text>
   </g>
   <g id="text_21">
    <text style="fill: #c35d21; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="552.384" y="634.440734" transform="rotate(-0 552.384 634.440734)">C  |  Shuffle mean endpoints, then REFIT</text>
   </g>
   <g id="text_22">
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(552.384 660.966281)">Keep destination geometry, x/time and valid masks.</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(552.384 674.955531)">Rebuild the candidate; fit a new training-side OLS head.</text>
    <text style="fill: #20364d; font: 11px 'DejaVu Sans'" transform="translate(552.384 688.944781)">Tests real assignments against fitted random targets.</text>
   </g>
   <g id="text_23">
    <text style="fill: #526476; font: 10.7px 'DejaVu Sans'; text-anchor: start" x="60.48" y="756.36" transform="rotate(-0 60.48 756.36)">Both controls: 1,000 allocations × the same 100 splits; representations stay fixed.  Geometry-only baseline: a separate, unmatched-input reference.</text>
   </g>
