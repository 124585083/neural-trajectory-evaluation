project:
  phase: 1
  seed: 42
  device: cuda

data:
  root: ../../data/sensorium_all_2023
  session: dynamic29514-2-9-Video-8744edeac3b4d1ce16b680916b5267ce
  frames: 80
  scale: 1.0
  include_behavior: true
  include_pupil_center: true
  normalization_stats: all
  physical_batch_size: 4
  effective_batch_size: 8
  num_workers: 0
  pin_memory: true
  sampling_rate_hz: 30.0

dynamic_reference:
  core_type: Factorized3dCore
  input_channels: 3
  hidden_channels: [32, 64, 128]
  spatial_input_kernel: [11, 11]
  temporal_input_kernel: 11
  spatial_hidden_kernel: [5, 5]
  temporal_hidden_kernel: 5
  stride: 1
  layers: 3
  gamma_input_spatial: 10.0
  gamma_input_temporal: 0.01
  bias: true
  hidden_nonlinearities: elu
  batch_norm: true
  padding: false
  final_nonlin: true
  momentum: 0.7

static_reference:
  core_type: Stacked2dCore
  input_channels: 3
  hidden_channels: 64
  input_kernel: 9
  hidden_kernel: 7
  layers: 4
  depth_separable: true
  stack: -1
  gamma_input: 6.3831
  pad_input: false
  final_nonlinearity: true
  momentum: 0.9
  batch_norm: true

shared_readout:
  type: FullGaussian2d
  bias: true
  init_mu_range: 0.2
  init_sigma: 1.0
  gamma_readout: 0.0
  gauss_type: full
  grid_mean_predictor:
    hidden_layers: 1
    hidden_features: 30
    final_tanh: true
  shifter:
    type: MLPShifter
    input_channels: 2
    hidden_channels: 5
    layers: 3
    gamma: 0.0
  output_nonlinearity: elu_plus_one

training:
  max_epochs: 200
  patience: 5
  lr_decay_steps: 4
  lr_decay_factor: 0.3
  min_lr: 0.0001
  tolerance: 0.000001
  amp: true
  dynamic_optimizer: AdamW
  dynamic_lr: 0.005
  static_optimizer: Adam
  static_lr: 0.009
  loss: PoissonLoss_sum
  scale_loss: true
  burn_in_frames: 50

benchmark:
  iterations: 200
  warmup_iterations: 20
