[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-total-parameter-matched"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pyyaml", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../01_baselines/src"]
markers = [
  "data: requires the five authorized Dynamic Sensorium sessions",
]
